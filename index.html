<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Log Analyzer</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app">
        <div class="main-block card">
    <h1>Log Analyzer</h1>

    <div>
        <button type="button" class="file-input" id="fileButton">Select File</button>
        <input type="file" id="fileInput" accept=".log,.json" class="hidden-file-input"/>
        <button id="exportButton">Export to CSV</button>
    </div>
    <div>
        <label>From: <input type="datetime-local" id="startTime" /></label>
        <label>To: <input type="datetime-local" id="endTime" /></label>
    </div>
    <div>
            <input type="text" id="messageKeyword" placeholder="Keyword search...">
    </div>
        <div>        
        <label> <input type="checkbox" id="ERROR" checked>ERROR</label>
        <label> <input type="checkbox" id="WARN" checked>WARN</label>
        <label> <input type="checkbox" id="INFO" checked>INFO</label>
        <label> <input type="checkbox" id="OTHERS" checked>OTHERS</label>
        <label> <input type="checkbox" id="showAllLevels"> ALL LEVELS</label>
    </div>


        </div>
    <div class="table-div card">
    <table id="logTable">
        <thead>
            <tr><th class="time">Time</th><th class="lvl">Level</th><th class="service">Service</th><th class="msg">Message</th></tr>
        </thead>
        <tbody id="logBody"></tbody>
    </table>
    </div>
    <div class="errors-div card">
        <textarea id="parseReport" readonly rows="4" cols="80"></textarea>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
